# Inference-fidelity suite (PROTOCOL.md §C.4, §H)
structures:
  - {name: chain,  n: 20, C: 3}
  - {name: tree,   n: 15, C: 3}       # balanced binary tree
  - {name: star,   n: 16, C: 3}       # degree-heterogeneous tree
  - {name: cycle,  n: 16, C: 3}
  - {name: grid,   n: 16, C: 3}       # 4x4
  - {name: grid7,  n: 16, C: 7}       # 4x4, C=7 continuity case (VE only)
  - {name: dense,  n: 14, C: 3, p_in: 0.8, p_out: 0.3}   # 2-block SBM
beta_grid: [0.0, 0.1, 0.25, 0.5, 0.75, 1.0, 1.3, 1.75, 2.5, 4.0]
alpha_levels: [0.5, 1.5]      # unary evidence strength; scaled by addendum-M2 calibration factor
uninformative_frac: 0.25
draws: 20
draw_seeds_start: 200         # draw seeds 200..219
enumeration_cutoff: 5.0e+6    # brute force when C^n <= cutoff, else min-fill VE
critical_beta: {3: 1.0051, 7: 1.2990}   # ln(1+sqrt(q)) markers, qualitative only

gibbs:
  chains: 4
  burn_in: 1000
  kept: 2000
  kept_reduced: 100           # variance panel
  rhat_gate: 1.01
  ess_gate: 400
  interchain_tv_gate: 0.02
lbp:
  damping: 0.5
  damping_retry: 0.9
  tol: 1.0e-6
  max_iters: 500
mf:
  tol: 1.0e-6
  max_sweeps: 500
